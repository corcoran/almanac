# /etc/nginx/sites-available/almanac.conf — host nginx vhost template.
#
# Operator workflow:
#   sudo cp deploy/nginx-almanac.conf /etc/nginx/sites-available/almanac.conf
#   sudo sed -i 's/__DOMAIN__/almanac.yourdomain.com/g' /etc/nginx/sites-available/almanac.conf
#   sudo ln -s /etc/nginx/sites-available/almanac.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Assumes Let's Encrypt has issued certs at /etc/letsencrypt/live/__DOMAIN__/.
# If your cert path differs (e.g. acme.sh, manual), adjust the ssl_* lines.
#
# This vhost has a single upstream — oauth2-proxy running in the docker
# compose stack at 127.0.0.1:24180. oauth2-proxy handles path routing
# internally (browser SSO for /, X-Forwarded-Email injection for /api/,
# skip-auth passthrough for /mcp/). Adding a route here is rarely needed;
# add upstreams to docker-compose.yml's oauth2-proxy command instead.

server {
  listen 443 ssl http2;
  server_name __DOMAIN__;

  ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

  # ssl_protocols / ssl_ciphers / HSTS etc. — assume the operator already
  # has a global ssl conf included via /etc/nginx/conf.d/ssl.conf or similar.
  # If not, add the standard hardening directives here.

  # Single upstream — oauth2-proxy fans out by path internally.
  location / {
    proxy_pass         http://127.0.0.1:24180;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # MCP Streamable HTTP can hold connections open for the duration of an
    # AI session. Disable buffering and bump the read timeout so the
    # transport isn't cut off mid-tool-call. The other endpoints don't
    # care about these settings; they're effectively no-ops for short reqs.
    proxy_http_version 1.1;
    proxy_buffering    off;
    proxy_read_timeout 3600s;
  }
}

# Redirect HTTP → HTTPS. Operator: keep certbot's webroot challenge alive
# by NOT redirecting /.well-known/acme-challenge/ — most certbot installs
# handle this via a separate conf snippet, but if yours doesn't, add a
# location {} block above the return.
server {
  listen 80;
  server_name __DOMAIN__;
  return 301 https://$host$request_uri;
}
