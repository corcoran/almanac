server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: non-file routes serve index.html. The shell must never be
  # cached — it has a stable URL but changing content (it pins the hashed asset
  # URLs), so a stale shell points at old/deleted assets after a deploy.
  #
  # We use `no-store`, NOT `no-cache`. `no-cache` only requires *revalidation*,
  # and nginx derives the shell's ETag from mtime+size — but every Vite build
  # produces a same-size index.html (only the fixed-length asset hashes inside
  # change), so a normal reload can get a false `304 Not Modified` and keep the
  # OLD shell, which still points at the previous bundle. `no-store` forbids
  # keeping any copy at all, so every load fetches the current shell
  # unconditionally. It's ~400 bytes gzipped; re-fetching is free. The hashed
  # assets below stay immutable. Covers `/`, deep links, AND /index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  # Long-lived caching for hashed assets (Vite emits content-hashed filenames,
  # so cache-busting is automatic when the bundle changes). More specific than
  # `location /`, so real asset requests match here.
  location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
